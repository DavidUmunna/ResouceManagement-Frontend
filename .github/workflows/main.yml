name: Deploy Frontend

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          npm install
          npm run build
          
      - name: Enable maintenance & clear old build
        uses: appleboy/ssh-action@v1
        with:
          host: 194.163.137.35
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            touch /var/www/erp.haldengroup.ng/maintenance.flag
            sudo systemctl restart nginx
            rm -rf /var/www/erp.haldengroup.ng/build

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 194.163.137.35
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "build/"
          target: "/var/www/erp.haldengroup.ng/"

      - name: Finalize deployment
        uses: appleboy/ssh-action@v1
        with:
          host: 194.163.137.35
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            mkdir -p /var/www/erp.haldengroup.ng/build/admin
            cp -r /var/www/erp.haldengroup.ng/build/static /var/www/erp.haldengroup.ng/build/admin/
            cp /var/www/erp.haldengroup.ng/build/haldenlogo_1.png /var/www/erp.haldengroup.ng/build/admin/haldenlogo_1.png
            rm /var/www/erp.haldengroup.ng/maintenance.flag
            sudo systemctl restart nginx
